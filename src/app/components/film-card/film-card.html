<article class="card" [routerLink]="['/films', film().id]">
  <img [src]="film().posterUrl" [alt]="film().title" class="poster" />
  <div class="info">
    <h3 class="title">{{ film().title }}</h3>
    <div class="meta">
      <span>{{ film().year }}</span>
      <span class="dot">&middot;</span>
      <span>{{ film().genre }}</span>
    </div>
    <div class="footer">
      <div class="rating">&#9733; {{ film().rating }}</div>
      <button
        class="fav"
        [class.active]="film().isFavorite"
        (click)="$event.stopPropagation(); toggleFavorite.emit(film().id)"
        [title]="film().isFavorite ? 'Remove from favorites' : 'Add to favorites'"
      >{{ film().isFavorite ? '♥' : '♡' }}</button>
    </div>
  </div>
</article>
